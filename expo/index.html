<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expo</title>
    <meta name="description" content="Expo — the everything arcade. Thousands of games, one click to play." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.8c1 6.2 4 9.2 10.2 10.2C16 13 13 16 12 22.2 11 16 8 13 1.8 12 8 11 11 8 12 1.8Z' fill='%236750A4'/%3E%3C/svg%3E"
    />
    <script>
      try {
        const t = localStorage.getItem("expo-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="hdr">
      <header class="topbar">
        <div class="brand-wrap">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 1.8c1 6.2 4 9.2 10.2 10.2C16 13 13 16 12 22.2 11 16 8 13 1.8 12 8 11 11 8 12 1.8Z"
              fill="currentColor"
            />
          </svg>
          <div class="brand-text">
            <h1 id="brand">Expo</h1>
            <p id="tagline" class="tagline">the everything arcade</p>
          </div>
        </div>
        <div class="search-wrap">
          <div class="searchbar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
              <path d="m20.5 20.5-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search games"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </div>
        <div class="top-actions">
          <div id="count" class="count">loading games…</div>
          <button id="theme-btn" class="iconbtn" title="Theme"></button>
        </div>
      </header>
      <nav id="chips" class="chips" aria-label="Filter by source"></nav>
    </div>

    <main>
      <div id="loader" class="loader-wrap" aria-label="Loading">
        <div class="loader"></div>
      </div>
      <section id="grid" class="grid" aria-label="Games"></section>
      <p id="empty" class="empty" hidden>No games match your search.</p>
      <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    </main>

    <footer class="foot">
      <span
        >Games are streamed from their original creators' public mirrors. Expo
        just puts them on one shelf.</span
      >
    </footer>

    <div id="overlay" class="overlay" hidden>
      <div class="player-bar">
        <div class="player-meta">
          <span id="p-source" class="p-source"></span>
          <span id="p-title" class="p-title"></span>
        </div>
        <div class="player-actions">
          <button id="p-mirror" class="pbtn outlined" hidden>Mirror</button>
          <button id="p-full" class="pbtn">Fullscreen</button>
          <button id="p-new" class="pbtn">Open</button>
          <button id="p-close" class="pbtn close">Close</button>
        </div>
      </div>
      <iframe
        id="frame"
        class="frame"
        title="Game"
        allow="autoplay; fullscreen; gamepad; microphone; camera; clipboard-write"
        allowfullscreen
      ></iframe>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
