<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="400" viewBox="0 0 2400 400">
  <defs>
    <filter id="flow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <linearGradient id="flow-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52d8c6" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.25;0" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#52d8c6" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#52d8c6;#8a9bff;#52d8c6" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8a9bff" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.3;0" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="flow-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a58aff" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#a58aff;#52d8c6;#a58aff" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a58aff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="400" fill="#10121a"/>
  <g filter="url(#flow-soft)">
    <path d="M -100 240 C 500 60 900 320 1500 140 C 1900 20 2200 180 2500 80 L 2500 -80 L -100 -80 Z" fill="url(#flow-a)" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 14; 0 0" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M -100 380 C 600 220 1100 420 1700 260 C 2100 160 2300 300 2500 220 L 2500 480 L -100 480 Z" fill="url(#flow-b)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 -10; 0 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="1900" cy="40" rx="360" ry="140" fill="#8a9bff" opacity="0.22">
      <animate attributeName="opacity" values="0.22;0.34;0.22" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="60" rx="320" ry="120" fill="#52d8c6" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.26;0.16" dur="15s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
