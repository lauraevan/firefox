    </filter>
    <linearGradient id="aurora-ribbon-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52d8c6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#52d8c6" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#8a9bff" stop-opacity="0.55"/>
